<body>
    <header>
        <div class="logo-area">
            <img src="images/hotel.jpg" alt="Logo" class="logo-img">
            <span>TechNova</span>
        </div>
        <button id="menu-btn" aria-label="Toggle Menu">&#9776;</button>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Our Specialists</h1>
        <div class="form-container">
            <form action="thank-you.html" method="get">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message / Inquiry:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Inquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> TechNova Solutions | Victor Eduardo Sanabria Diaz | WDD 231</p>
        <p><a href="https://youtu.be/TU_ENLACE_DE_VIDEO_AQUI" target="_blank">Project Video Demonstration</a></p>
        <p id="lastModified"></p>
    </footer>
</body>
